<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MIDI Player: Liquid Glass OS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <style>
        :root {
            /* --- 液体玻璃核心变量 --- */
            --glass-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.1));
            --glass-border: rgba(255, 255, 255, 0.4);
            
            /* 立体感阴影 */
            --liquid-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1), 
                0 5px 15px rgba(0, 0, 0, 0.05), 
                inset 0 0 0 1px rgba(255, 255, 255, 0.3), 
                inset 2px 2px 20px rgba(255, 255, 255, 0.5), 
                inset -5px -5px 20px rgba(0, 0, 0, 0.05);
            
            --accent-color: #007aff;
            --accent-glow: 0 0 20px rgba(0, 122, 255, 0.4);
            --accent-danger: #ff3b30;
            --text-main: #1d1d1f;
            --text-sub: #6e6e73;
            
            --radius-large: 32px;
            --radius-small: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 30px;
            color: var(--text-main);
            overflow-x: hidden;
            background: linear-gradient(135deg, #e0e5ec 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        #bgCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            opacity: 0.8;
        }

        .dashboard {
            display: flex; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; position: relative; z-index: 10;
            transition: opacity 0.3s ease;
        }

        /* --- 面板通用样式 --- */
        .panel {
            background: var(--glass-surface);
            backdrop-filter: blur(40px) saturate(150%); 
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border-radius: var(--radius-large);
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            box-shadow: var(--liquid-shadow);
            padding: 32px; 
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; /* 确保内部定位正确 */
            overflow: hidden;   /* 配合光效 */
        }
        
        .panel::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1; 
            pointer-events: none;
            border-radius: var(--radius-large);
            background: radial-gradient(
                circle at center, 
                rgba(255, 255, 255, 0) 40%, 
                rgba(255, 255, 255, 0.1) 80%, 
                rgba(255, 255, 255, 0.9) 100%
            );
            mix-blend-mode: overlay; 
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* 提升交互控件层级 */
        .panel > * { position: relative; z-index: 2; }
        
        .panel:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.12),
                inset 0 0 0 1px rgba(255, 255, 255, 0.5),
                inset 2px 2px 25px rgba(255, 255, 255, 0.8);
        }

        .controls-left { flex: 1; min-width: 320px; }
        .adsr-panel { flex: 1; min-width: 420px; position: relative; } 

        h1 { 
            margin-top: 0; font-weight: 700; font-size: 32px; letter-spacing: -0.02em; 
            background: linear-gradient(135deg, #333, #666);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        h2 { 
            margin-top: 0; font-size: 13px; color: var(--text-sub); 
            text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; opacity: 0.8;
            margin-bottom: 25px;
        }

        .control-group { margin-bottom: 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

        /* --- 按钮样式 --- */
        input[type="file"]::file-selector-button, button {
            background: rgba(255, 255, 255, 0.5);
            color: var(--accent-color);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            box-shadow: 
                0 4px 10px rgba(0,0,0,0.05),
                inset 1px 1px 2px rgba(255,255,255,0.8),
                inset -1px -1px 2px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        button:hover, input[type="file"]::file-selector-button:hover {
            background: var(--accent-color);
            color: white;
            box-shadow: var(--accent-glow), inset 2px 2px 5px rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        
        button:disabled { 
            background: rgba(0,0,0,0.05); color: #ccc; box-shadow: none; cursor: not-allowed; transform: none;
        }
        
        #stopBtn { color: var(--accent-danger); }
        #stopBtn:hover { background: var(--accent-danger); box-shadow: 0 0 20px rgba(255, 59, 48, 0.4); }

        #taptapBtn { color: #ff2d55; background: rgba(255, 45, 85, 0.1); }
        #taptapBtn:hover { background: #ff2d55; color: white; box-shadow: 0 0 20px rgba(255, 45, 85, 0.4); }

        #status { font-size: 13px; color: var(--text-sub); font-weight: 500; padding-top: 10px; }

        /* --- 液态滑块 (Liquid Slider) --- */
        .liquid-slider-wrapper {
            position: relative;
            width: 100%;
            height: 40px; 
            display: flex;
            align-items: center; 
            margin-right: 10px;
            flex: 1;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            outline: none;
            margin: 0;
            z-index: 2;
            position: relative;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1), inset -1px -1px 2px rgba(255,255,255,0.5);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px; 
            width: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,1), rgba(230,230,230,0.9));
            cursor: grab;
            margin-top: 0px; 
            box-shadow: 
                0 4px 10px rgba(0,0,0,0.15),
                inset 2px 2px 5px rgba(255,255,255,1),
                inset -2px -2px 5px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.6);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        input[type="range"]:active::-webkit-slider-thumb {
            cursor: grabbing;
            transform: scale(0.9);
        }

        .slider-effect-ring {
            position: absolute; top: 50%; width: 60px; height: 60px;
            pointer-events: none; z-index: 1; opacity: 0;
            transform: translate(-50%, -50%) scale(0.2);
            transition: opacity 0.3s, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .liquid-slider-wrapper.active .slider-effect-ring { opacity: 1; }

        /* --- 旋钮 --- */
        .adsr-visualizer { 
            width: 100%; height: 120px; border-radius: 20px; margin-bottom: 24px; 
            background: rgba(255,255,255,0.3);
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.05);
        }
        .knob-container { display: flex; justify-content: space-around; text-align: center; gap: 4px; }
        .knob-wrapper { 
            width: 60px; display: flex; flex-direction: column; align-items: center;
            cursor: ew-resize; user-select: none; touch-action: none;
        }
        .knob { 
            width: 48px; height: 48px; border-radius: 50%; 
            background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(255,255,255,0.4));
            margin-bottom: 12px; position: relative; 
            box-shadow: 
                0 8px 16px rgba(0,0,0,0.1),
                inset 2px 2px 5px rgba(255,255,255,1), 
                inset -2px -2px 5px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.4);
        }
        .knob::after { 
            content: ''; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); 
            width: 4px; height: 12px; background-color: var(--accent-color); border-radius: 4px; 
            box-shadow: 0 0 5px var(--accent-color);
        }
        .knob-input { position: absolute; top: 0; left: 8px; width: 44px; height: 44px; opacity: 0; cursor: ns-resize; transform: rotate(-90deg); pointer-events: none; }
        .knob-label { font-size: 10px; font-weight: 700; color: var(--text-sub); margin-bottom: 4px; pointer-events: none; letter-spacing: 0.5px; white-space: nowrap; }
        .val-input { 
            width: 40px; background: rgba(255,255,255,0.4); border: none; border-radius: 8px;
            padding: 4px 0; text-align: center; font-size: 12px; color: var(--text-main); font-family: monospace; font-weight: 600;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.05); pointer-events: auto; 
        }
        .val-input:focus { background: white; box-shadow: 0 0 0 2px var(--accent-color); outline: none; }

        /* --- 乐谱显示排版 --- */
        #scoreDisplay {
            position: relative; z-index: 10; 
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(50px) saturate(180%);
            -webkit-backdrop-filter: blur(50px) saturate(180%);
            border-radius: var(--radius-large); 
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.1),
                inset 0 0 0 1px rgba(255,255,255,0.4),
                inset 0 20px 40px rgba(255,255,255,0.4);
            padding: 40px;
            font-family: "SF Mono", "Menlo", monospace;
            line-height: 1.5; font-size: 20px;
            white-space: normal; overflow-x: auto; min-height: 220px;
            transition: opacity 0.3s ease;
        }
        .score-notes { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; row-gap: 65px; }
        .score-info { color: var(--text-sub); font-size: 14px; font-weight: 600; margin-bottom: 25px; border-bottom: 2px solid rgba(0,0,0,0.03); padding-bottom: 15px; }
        .note-unit { display: inline-flex; flex-direction: row; align-items: baseline; margin: 0 2px; position: relative; cursor: default; min-width: 1.5em; vertical-align: baseline; }
        .note-column { display: flex; flex-direction: column; align-items: center; position: relative; }
        .note-content { font-weight: 700; font-size: 24px; color: #333; line-height: 1; text-shadow: 1px 1px 0 rgba(255,255,255,0.5); padding: 2px 0; }
        .current-note .note-content { color: var(--accent-color); transform: scale(1.2); text-shadow: 0 0 15px var(--accent-color); }
        .dots-container { display: flex; flex-direction: column; gap: 2px; align-items: center; line-height: 0; }
        .dots-top { position: absolute; bottom: 24px; left: 0; width: 100%; pointer-events: none; } 
        .bottom-wrapper { position: absolute; top: 22px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; } 
        .dot-mark { width: 5px; height: 5px; background-color: #333; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .current-note .dot-mark { background-color: var(--accent-color); box-shadow: 0 0 5px var(--accent-color); }
        .d-line { width: 100%; height: 3px; border-radius: 2px; background: #333; margin-top: 2px; }
        .current-note .d-line { background: var(--accent-color); box-shadow: 0 0 5px var(--accent-color); }
        .bar-line { color: var(--accent-danger); font-weight: 300; opacity: 0.6; align-self: auto; }
        .rhythm-dot { position: absolute; right: -8px; bottom: 2px; font-size: 18px; line-height: 0; color: #333; }
        .current-note .rhythm-dot { color: var(--accent-color); }
        .extension-dash { display: inline-block; font-weight: 400; margin-left: 6px; font-size: 20px; color: #555; align-self: center; }
        .current-note .extension-dash { color: var(--accent-color); }
        .chord-group { display: inline-flex; flex-direction: column; border: 1px dashed rgba(0,0,0,0.1); border-radius: 4px; padding: 2px; align-items: center; }

        /* --- 下拉菜单 --- */
        select {
            appearance: none; background: rgba(255,255,255,0.6); border: none;
            padding: 8px 30px 8px 12px; border-radius: 12px; 
            font-size: 14px; font-weight: 600; color: var(--text-main);
            box-shadow: 
                0 4px 10px rgba(0,0,0,0.05),
                inset 1px 1px 2px rgba(255,255,255,0.8);
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007aff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 10px center; background-size: 10px;
        }

        /* --- 模态框 --- */
        #handwriteModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(200, 200, 200, 0.2); z-index: 100;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(20px);
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px; border-radius: 40px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,255,0.5);
            max-width: 900px; width: 90%;
            display: flex; flex-direction: column; gap: 20px;
        }
        .grid-container {
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px;
            background: rgba(0,0,0,0.03); padding: 15px; border-radius: 20px;
            max-height: 60vh; overflow-y: auto;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.05);
        }
        .grid-cell { 
            background: white; border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            transition: transform 0.1s;
        }
        .grid-cell:hover { transform: scale(1.05); }

        /* --- TapTap Overlay --- */
        #taptap-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px); 
            display: none;
            flex-direction: column; align-items: center; justify-content: center;
            transition: background-color 0.15s ease, opacity 0.3s ease;
            cursor: pointer; overflow: hidden;
        }
        #taptap-overlay.active { display: flex; }

        .taptap-hint {
            font-size: 28px; font-weight: 800; color: #333; letter-spacing: 4px;
            text-align: center; pointer-events: none; transition: opacity 0.5s;
            user-select: none;
            text-shadow: 0 2px 10px rgba(255,255,255,0.5);
            mix-blend-mode: overlay;
        }
        .taptap-hint span { font-size: 16px; color: #555; font-weight: 500; letter-spacing: 1px; display: block; margin-top: 10px; }

        .taptap-exit {
            position: absolute; top: 30px; right: 30px;
            width: 50px; height: 50px;
            font-size: 30px; border-radius: 50%;
            background: rgba(255,255,255,0.5); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; color: #333;
        }
        .taptap-exit:hover { transform: scale(1.1); color: #000; }

        .tap-ripple {
            position: absolute; width: 20px; height: 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rippleAnim 0.6s cubic-bezier(0, 0, 0.2, 1);
            pointer-events: none;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }
        @keyframes rippleAnim {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; border-width: 10px; }
            100% { transform: translate(-50%, -50%) scale(30); opacity: 0; border-width: 0px; }
        }

        #loadingOverlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(255,255,255,0.8); display: none; align-items: center; justify-content: center;
            font-weight: bold; color: var(--accent-color); border-radius: 24px;
        }

        /* --- 悬浮停止按钮 --- */
        #floatingStopBtn {
            position: fixed; bottom: 40px; right: 40px; width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(255, 59, 48, 0.9), rgba(255, 45, 85, 0.8));
            color: white; font-weight: 800; font-size: 16px; border: 2px solid rgba(255,255,255,0.5);
            z-index: 900; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(255, 59, 48, 0.4), inset 2px 2px 5px rgba(255,255,255,0.5), inset -2px -2px 5px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px); cursor: pointer;
            transform: scale(0); opacity: 0; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            pointer-events: none;
        }
        #floatingStopBtn.visible { transform: scale(1); opacity: 1; pointer-events: auto; }
        #floatingStopBtn.vanishing { animation: popVanish 0.5s forwards; }
        @keyframes popVanish { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.2); opacity: 0.8; } 100% { transform: scale(0); opacity: 0; } }
        #floatingStopBtn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(255, 59, 48, 0.6); }

        /* [NEW] TapTap 中性凹透镜 */
        #center-lens {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 999; 
            pointer-events: none; 
            display: none; 
            
            /* 1. 背景：边缘白，中间透 */
            background: radial-gradient(
                circle at 40% 40%, 
                rgba(255, 255, 255, 0.1) 0%, 
                rgba(255, 255, 255, 0.05) 50%, 
                rgba(255, 255, 255, 0) 80%
            );
            
            /* 2. 阴影：内阴影制造凹陷感 */
            box-shadow: 
                inset 10px 10px 30px rgba(0, 0, 0, 0.15),
                inset -5px -5px 15px rgba(255, 255, 255, 0.4),
                0 0 0 1px rgba(255,255,255,0.05);

            /* 3. 滤镜：折射模糊 */
            backdrop-filter: blur(1px) contrast(1.1);
            transition: opacity 0.3s ease;
        }
        #center-lens.active { display: block; }

    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div class="dashboard">
        <div class="panel controls-left">
            <h1>MIDI Player</h1>
            
            <div class="control-group">
                <input type="file" id="midiFile" accept=".mid,.midi">
                <button id="playBtn">Play</button>
                <button id="stopBtn" disabled>Stop</button>
                <button id="taptapBtn">TapTap Mode</button>
                <button id="handwriteBtn">Write Score</button>
            </div>
            
            <div class="control-group">
                <label for="transpose" style="font-size:14px; font-weight:600; color:var(--text-sub)">Transpose</label>
                <input type="number" id="transpose" value="0" min="-24" max="24" step="1" class="val-input" style="width:40px;">
                
                <label style="font-size:14px; font-weight:600; color:var(--text-sub); margin-left:15px;">Key</label>
                <select id="keySignature">
                    <option value="C">C / Am</option>
                    <option value="G">G / Em (1#)</option>
                    <option value="D">D / Bm (2#)</option>
                    <option value="A">A / F#m (3#)</option>
                    <option value="E">E / C#m (4#)</option>
                    <option value="B">B / G#m (5#)</option>
                    <option value="F#">F# / D#m (6#)</option>
                    <option value="F">F / Dm (1b)</option>
                    <option value="Bb">Bb / Gm (2b)</option>
                    <option value="Eb">Eb / Cm (3b)</option>
                    <option value="Ab">Ab / Fm (4b)</option>
                    <option value="Db">Db / Bbm (5b)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label style="font-size:14px; font-weight:600; min-width:60px;">Volume</label>
                <input type="range" id="volume" min="0" max="100" value="50">
                <span id="volumeValue" style="width:30px; text-align:right; font-size:13px; font-weight:600;">50</span>
            </div>
            
            <div class="control-group">
                <label style="font-size:14px; font-weight:600; min-width:60px;">Tempo</label>
                <input type="range" id="tempo" min="50" max="200" value="100">
                <span id="tempoValue" style="width:30px; text-align:right; font-size:13px; font-weight:600;">100</span>
            </div>
            
            <div id="status">Select a MIDI file or write your own</div>
        </div>

        <div class="panel adsr-panel">
            <h2>Envelope Control</h2>
            
            <select id="oscillatorType" style="position: absolute; top: 25px; right: 30px; width: auto; padding-right: 35px; font-size: 12px; z-index: 20;">
                <option value="sine">Sine </option>
                <option value="square">Square </option>
                <option value="triangle" selected>Triangle 1 </option>
                <option value="sawtooth">Triangle 2 </option>
            </select>

            <canvas id="adsrCanvas" class="adsr-visualizer" width="340" height="120"></canvas>
            
            <div class="knob-container">
                <div class="knob-wrapper">
                    <div id="knob-a" class="knob"></div>
                    <input type="range" id="adsr-attack-knob" class="knob-input" min="0" max="100" step="0.1" value="0">
                    <div class="knob-label">ATTACK</div>
                    <div><input type="number" id="val-a" class="val-input" value="50"> <span class="unit-label" style="font-size:10px;color:#999">ms</span></div>
                </div>
                <div class="knob-wrapper">
                    <div id="knob-d" class="knob"></div>
                    <input type="range" id="adsr-decay-knob" class="knob-input" min="0" max="100" step="0.1" value="0">
                    <div class="knob-label">DECAY</div>
                    <div><input type="number" id="val-d" class="val-input" value="200"> <span class="unit-label" style="font-size:10px;color:#999">ms</span></div>
                </div>
                <div class="knob-wrapper">
                    <div id="knob-s" class="knob"></div>
                    <input type="range" id="adsr-sustain-knob" class="knob-input" min="0" max="100" step="1" value="60">
                    <div class="knob-label">SUS LVL</div>
                    <div><input type="number" id="val-s" class="val-input" value="60"> <span class="unit-label" style="font-size:10px;color:#999">%</span></div>
                </div>
                <div class="knob-wrapper">
                    <div id="knob-st" class="knob"></div>
                    <input type="range" id="adsr-sus-time-knob" class="knob-input" min="0" max="100" step="0.1" value="0">
                    <div class="knob-label">SUS TIME</div>
                    <div><input type="number" id="val-st" class="val-input" value="200"> <span class="unit-label" style="font-size:10px;color:#999">ms</span></div>
                </div>
                <div class="knob-wrapper">
                    <div id="knob-r" class="knob"></div>
                    <input type="range" id="adsr-release-knob" class="knob-input" min="0" max="100" step="0.1" value="0">
                    <div class="knob-label">RELEASE</div>
                    <div><input type="number" id="val-r" class="val-input" value="300"> <span class="unit-label" style="font-size:10px;color:#999">ms</span></div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="scoreDisplay">
        <div class="score-container" id="scoreContainer">
            <div style="color:var(--text-sub); text-align:center; padding-top:40px; font-weight:500;">No score loaded</div>
        </div>
    </div>

    <button id="floatingStopBtn">STOP</button>

    <div id="handwriteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Handwrite Score (Draw 1-7)</h2>
                <div style="display:flex; gap:10px; align-items:center;">
                    <label>Key:</label>
                    <select id="modalKeySig">
                        <option value="C">C</option>
                        <option value="G">G</option>
                        <option value="D">D</option>
                        <option value="F">F</option>
                        <option value="Bb">Bb</option>
                    </select>
                </div>
            </div>
            <div class="grid-container" id="drawingGrid"></div>
            <div class="modal-footer">
                <button id="clearGridBtn" style="color:#666; background:rgba(0,0,0,0.05)">Clear All</button>
                <button id="cancelGridBtn" style="color:#666; background:rgba(0,0,0,0.05)">Cancel</button>
                <button id="recognizeBtn" style="background:var(--accent-color); color:white; box-shadow:var(--accent-glow)">Confirm & Play</button>
            </div>
            <div id="loadingOverlay">Loading AI Model / Recognizing...</div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/midi-parser-js@4.0.4/src/main.min.js"></script>    
    <script type="module" src="js/main.js"></script>
</body>
</html>
